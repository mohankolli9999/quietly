<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quietly</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Quietly</h1>
      <p id="status" class="status">Checking…</p>
    </header>

    <div class="stats">
      <p class="count"><strong id="count">0</strong> ads muted</p>
      <p class="meta">
        <span><strong id="today">0</strong> today</span>
        <span><strong id="saved">0</strong> min saved</span>
      </p>
      <p class="bysite">
        <span>Spotify <strong id="spotifyCount">0</strong></span>
        <span>Amazon <strong id="amazonCount">0</strong></span>
      </p>
    </div>

    <label class="row">
      <span>Mute ads</span>
      <input type="checkbox" id="enabled" />
    </label>

    <label class="row">
      <span>Show on-page indicator</span>
      <input type="checkbox" id="indicator" />
    </label>

    <footer>
      <button type="button" id="settings" class="link">Settings</button>
      <a id="repo" href="#" target="_blank" rel="noreferrer noopener">Source code</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
